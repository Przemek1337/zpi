seed: 42
device: auto  # auto | cpu | cuda | cuda:<index>

logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  file: null   # e.g. logs/training.log

data:
  # splits archive written by the preprocessing notebook; generated by running the notebook when missing
  splits_path: data/processed/splits.npz
  preparation_notebook: data/data_preprocessing.ipynb
  # alternatively a pair of CSV files (features + label column) instead of the two keys above:
  # train_path: data/processed/train.csv
  # validation_path: data/processed/validation.csv
  label_column: Class
  legitimate_label: 0
  drop_columns: []

model:
  hidden_dims: [24, 16]
  latent_dim: 8
  activation: leaky_relu  # relu | leaky_relu | elu | gelu | selu | tanh
  dropout: 0.1
  batch_norm: true

optimizer:
  name: adam  # adam | adamw | sgd | rmsprop
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5

scheduler:
  enabled: true
  factor: 0.5
  patience: 3
  min_learning_rate: 1.0e-6

training:
  epochs: 100
  batch_size: 256
  gradient_clip_norm: 1.0  # null disables clipping
  num_workers: 0
  input_noise_std: 0.0  # > 0 turns on denoising (noise on training inputs, clean reconstruction target)

early_stopping:
  enabled: true
  patience: 10
  min_delta: 1.0e-6

evaluation:
  max_false_positive_rate: 0.01  # recall is reported at the threshold keeping validation FPR below this

output:
  directory: artifacts/autoencoder
